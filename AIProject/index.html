<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Chat</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
      .container { text-align: center; }
      textarea { width: 100%; max-width: 500px; padding: 10px; font-size: 16px; }
      button { padding: 10px 20px; font-size: 16px; background: #4285f4; color: white; border: none; cursor: pointer; }
      button:disabled { background: #ccc; }
      #output { margin-top: 20px; text-align: left; background: #f5f5f5; padding: 20px; border-radius: 8px; white-space: pre-wrap; }
      pre { margin: 0; font-size: 14px; }
    </style>
  </head>
<body>
    <div class="container">
      <h1>Gemini AI Chat</h1>
      <textarea id="userInput" placeholder="Enter your prompt here..." rows="4" cols="50"></textarea>
      <br><br>
      <button id="sendBtn">Send</button>
      <div id="loading" style="display:none;">Loading...</div>
      <div id="output"></div>
    </div>
  </body>
<script>
  const API_KEY = 'AIzaSyDiVwfmdBpZ8qOnahGm5r3NZZzrDTIIU48';

  const sendBtn = document.getElementById('sendBtn');
  const userInput = document.getElementById('userInput');
  const loading = document.getElementById('loading');
  const output = document.getElementById('output');

  sendBtn.addEventListener('click', async () => {
    const userText = userInput.value.trim();
    if (!userText) return alert('Please enter a prompt');

    loading.style.display = 'block';
    output.innerHTML = '';
    sendBtn.disabled = true;

    try {
      const response = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`,
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            contents: [{ parts: [{ text: userText }] }],
          }),
        }
      );

      if (!response.ok) throw new Error(`API error: ${response.status}`);

      const data = await response.json();
      console.log('Full response:', data);
      console.log('AI text:', data.candidates?.[0]?.content?.parts?.[0]?.text || 'No response');

      const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || 'No response received';
      output.innerHTML = `<strong>AI Response:</strong><br><pre>${aiText}</pre>`;

    } catch (error) {
      console.error('Error:', error);
      output.innerHTML = `<strong>Error:</strong> ${error.message}`;
    } finally {
      loading.style.display = 'none';
      sendBtn.disabled = false;
      userInput.value = '';
    }
  });
</script>
</html>
